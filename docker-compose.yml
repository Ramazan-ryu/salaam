# Local development services only (laptop-friendly): PostgreSQL + PostGIS, and MinIO.
# Apps run natively with pnpm. See README.md.
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: salaam
      POSTGRES_PASSWORD: salaam
      POSTGRES_DB: salaam_dev
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./infra/db-init:/docker-entrypoint-initdb.d:ro

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: salaam
      MINIO_ROOT_PASSWORD: salaam-dev-only
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    profiles: ["storage"]

volumes:
  db-data:
  minio-data:
